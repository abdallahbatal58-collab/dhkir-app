<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14563f"/>
      <stop offset="100%" stop-color="#082820"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d878"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a8871f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c7355" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#082820" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- الخلفية -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <circle cx="256" cy="240" r="180" fill="url(#glow)"/>

  <!-- الإطار الذهبي -->
  <rect x="28" y="28" width="456" height="456" rx="78" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <rect x="50" y="50" width="412" height="412" rx="62" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>

  <!-- نجوم الزوايا -->
  <text x="85" y="105" font-family="serif" font-size="28" fill="url(#gold)" text-anchor="middle" opacity="0.8">✦</text>
  <text x="427" y="105" font-family="serif" font-size="28" fill="url(#gold)" text-anchor="middle" opacity="0.8">✦</text>
  <text x="85" y="440" font-family="serif" font-size="28" fill="url(#gold)" text-anchor="middle" opacity="0.8">✦</text>
  <text x="427" y="440" font-family="serif" font-size="28" fill="url(#gold)" text-anchor="middle" opacity="0.8">✦</text>

  <!-- البسملة صغيرة فوق -->
  <text x="256" y="160" font-family="Amiri, serif" font-size="46" fill="url(#gold)" text-anchor="middle" opacity="0.9">﷽</text>

  <!-- الاسم الرئيسي -->
  <text x="256" y="345" font-family="Amiri, Times New Roman, serif" font-size="180" font-weight="700" fill="url(#gold)" text-anchor="middle">ذِكْر</text>

  <!-- خط زخرفي تحت -->
  <line x1="170" y1="390" x2="342" y2="390" stroke="url(#gold)" stroke-width="3" opacity="0.7"/>
  <circle cx="256" cy="390" r="6" fill="url(#gold)"/>
  <circle cx="170" cy="390" r="4" fill="url(#gold)" opacity="0.7"/>
  <circle cx="342" cy="390" r="4" fill="url(#gold)" opacity="0.7"/>

  <!-- زخرفة إسلامية أسفل -->
  <path d="M 220 425 Q 256 445 292 425" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
</svg>