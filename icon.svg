<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <!-- خلفية متدرجة أخضر داكن -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a3d2a"/>
            <stop offset="100%" stop-color="#041510"/>
        </linearGradient>
        <!-- ذهبي متدرج للعناصر -->
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f4e4b8"/>
            <stop offset="50%" stop-color="#d4af37"/>
            <stop offset="100%" stop-color="#a8824a"/>
        </linearGradient>
        <!-- هالة خفيفة خلف اليد -->
        <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#d4af37" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- خلفية التطبيق -->
    <rect width="512" height="512" fill="url(#bgGrad)" rx="90"/>

    <!-- هالة ذهبية خلفية -->
    <circle cx="256" cy="225" r="150" fill="url(#haloGrad)"/>

    <!-- إطار دائري خارجي -->
    <circle cx="256" cy="225" r="145" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.35"/>
    <circle cx="256" cy="225" r="152" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.18"/>

    <!-- اليد الداعية -->
    <g fill="url(#goldGrad)">
        <!-- الخنصر -->
        <rect x="205" y="150" width="24" height="60" rx="12"/>
        <!-- البنصر -->
        <rect x="231" y="135" width="24" height="75" rx="12"/>
        <!-- الوسطى (الأطول) -->
        <rect x="257" y="120" width="24" height="90" rx="12"/>
        <!-- السبابة -->
        <rect x="283" y="135" width="24" height="75" rx="12"/>
        <!-- الكف -->
        <rect x="200" y="195" width="112" height="130" rx="32"/>
        <!-- الإبهام -->
        <rect x="302" y="232" width="38" height="22" rx="11"/>
    </g>

    <!-- النص الذهبي - السطر الأول -->
    <text x="256" y="400"
          text-anchor="middle"
          font-family="'Aref Ruqaa', 'Amiri', 'Times New Roman', serif"
          font-size="44"
          font-weight="700"
          fill="url(#goldGrad)">ألا بذكر الله</text>

    <!-- النص الذهبي - السطر الثاني -->
    <text x="256" y="462"
          text-anchor="middle"
          font-family="'Aref Ruqaa', 'Amiri', 'Times New Roman', serif"
          font-size="44"
          font-weight="700"
          fill="url(#goldGrad)">تطمئن القلوب</text>
</svg>